<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Harvard Quad architecture overview</title>
  <desc id="desc">Architecture overview of the Harvard Quad React, Supabase, and Capacitor implementation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f5"/>
      <stop offset="1" stop-color="#f0e9df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#27251f" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #27251f; }
      .subtitle { font: 400 19px Inter, Arial, sans-serif; fill: #6f675f; }
      .label { font: 700 22px Inter, Arial, sans-serif; fill: #27251f; }
      .body { font: 400 16px Inter, Arial, sans-serif; fill: #5f574f; }
      .small { font: 600 14px Inter, Arial, sans-serif; fill: #7d2d3a; letter-spacing: 0.04em; }
      .line { stroke: #b98b72; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <text x="64" y="72" class="title">Harvard Quad</text>
  <text x="64" y="106" class="subtitle">Campus social platform · React, Supabase, and Capacitor</text>
  <text x="1216" y="72" text-anchor="end" class="small">INDEPENDENT PROJECT</text>

  <path class="line" d="M306 282 H356"/>
  <path class="line" d="M612 282 H662"/>
  <path class="line" d="M918 282 H968"/>
  <path class="line" d="M510 448 V488 H816 V448"/>

  <g filter="url(#shadow)">
    <rect x="54" y="174" width="252" height="216" rx="20" fill="#ffffff"/>
    <rect x="356" y="174" width="256" height="216" rx="20" fill="#ffffff"/>
    <rect x="662" y="174" width="256" height="216" rx="20" fill="#ffffff"/>
    <rect x="968" y="174" width="258" height="216" rx="20" fill="#ffffff"/>
    <rect x="356" y="488" width="562" height="100" rx="20" fill="#fffaf6"/>
  </g>

  <rect x="54" y="174" width="252" height="8" rx="4" fill="#a51c30"/>
  <rect x="356" y="174" width="256" height="8" rx="4" fill="#d47455"/>
  <rect x="662" y="174" width="256" height="8" rx="4" fill="#b98b72"/>
  <rect x="968" y="174" width="258" height="8" rx="4" fill="#7d2d3a"/>

  <text x="78" y="224" class="label">User Experiences</text>
  <text x="78" y="258" class="body">Desktop and mobile shells</text>
  <text x="78" y="286" class="body">Feeds · Squads · Messages</text>
  <text x="78" y="314" class="body">Profiles · Search · Alerts</text>
  <text x="78" y="342" class="body">Touch and viewport handling</text>

  <text x="380" y="224" class="label">React Client</text>
  <text x="380" y="258" class="body">React 18 · TypeScript · Vite</text>
  <text x="380" y="286" class="body">Tailwind · Radix · Tiptap</text>
  <text x="380" y="314" class="body">Auth and profile contexts</text>
  <text x="380" y="342" class="body">State-driven SPA navigation</text>

  <text x="686" y="224" class="label">Domain Services</text>
  <text x="686" y="258" class="body">Feed and relationship graph</text>
  <text x="686" y="286" class="body">Messaging and media</text>
  <text x="686" y="314" class="body">Squad membership workflows</text>
  <text x="686" y="342" class="body">Signed assets and blocking</text>

  <text x="992" y="224" class="label">Supabase</text>
  <text x="992" y="258" class="body">Auth · PostgreSQL · Realtime</text>
  <text x="992" y="286" class="body">Storage · RLS · RPCs</text>
  <text x="992" y="314" class="body">Database functions · triggers</text>
  <text x="992" y="342" class="body">Policy and schema evolution</text>

  <text x="380" y="530" class="label">iOS Packaging Branch</text>
  <text x="380" y="560" class="body">Older snapshot · Capacitor 8 · Xcode/SPM · OAuth return · lifecycle persistence</text>

  <text x="64" y="620" class="small">PAUSED BEFORE PUBLIC LAUNCH · NO LIVE DEMO LINKED</text>
  <text x="1216" y="620" text-anchor="end" class="body">Not affiliated with Harvard University</text>
</svg>
